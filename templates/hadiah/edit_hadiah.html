{% extends 'base.html' %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 py-8">
    <div class="bg-white p-8 rounded-lg shadow border border-gray-200">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Edit Hadiah</h2>
        
        <form method="POST">
            {% csrf_token %}

            <div class="grid grid-cols-1 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Kode Hadiah</label>
                    <input type="text" value="{{ hadiah.kode_hadiah }}" readonly class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 bg-gray-100 text-gray-500 cursor-not-allowed sm:text-sm">
                    <p class="mt-1 text-xs text-gray-500">Kode hadiah tidak dapat diubah.</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Nama Hadiah</label>
                    <input type="text" name="nama_hadiah" value="{{ hadiah.nama_hadiah }}" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Penyedia</label>
                    <select name="id_penyedia" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 bg-white focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                        {% for penyedia in penyedia_list %}
                            <option value="{{ penyedia.id_penyedia }}" {% if penyedia.id_penyedia == hadiah.id_penyedia %}selected{% endif %}>{{ penyedia.nama_penyedia }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Harga (Miles)</label>
                    <input type="number" name="harga_miles" value="{{ hadiah.harga_miles }}" min="1" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Deskripsi</label>
                    <textarea name="deskripsi" rows="3" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">{{ hadiah.deskripsi }}</textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Valid Start Date</label>
                        <input type="date" name="valid_start_date" value="{{ hadiah.valid_start_date_value }}" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Program End</label>
                        <input type="date" name="program_end" value="{{ hadiah.program_end_value }}" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                </div>
            </div>

            <div class="mt-8 flex justify-end space-x-3">
                <a href="{% url 'red:daftar_hadiah' %}" class="bg-white py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none">Batal</a>
                <button type="submit" class="bg-blue-600 border border-transparent rounded-md shadow-sm py-2 px-4 text-sm font-medium text-white hover:bg-blue-700 focus:outline-none">Simpan Perubahan</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
