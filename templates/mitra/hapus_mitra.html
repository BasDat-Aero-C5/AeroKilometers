{% extends 'base.html' %}

{% block content %}
<div class="max-w-lg mx-auto px-4 py-16">
    <div class="bg-white p-6 rounded-lg shadow-md border border-red-200 text-center">
        
        <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100 mb-4">
            <svg class="h-6 w-6 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
        </div>

        <h2 class="text-xl font-bold text-gray-900 mb-2">Konfirmasi Hapus Mitra</h2>
        <p class="text-sm text-gray-600 mb-6">
            Apakah Anda yakin ingin menghapus mitra <strong>{{ mitra.nama_mitra }}</strong>? 
            <br><br>
            <span class="text-xs text-red-700 bg-red-50 py-2 px-3 rounded font-bold block">Peringatan: Menghapus mitra ini akan menghapus secara permanen seluruh Hadiah yang disediakan oleh mitra bersangkutan.</span>
        </p>

        <form method="POST" class="flex justify-center space-x-4 mt-6">
            {% csrf_token %}
            <a href="{% url 'red:daftar_mitra' %}" class="bg-white py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none">
                Batal
            </a>
            <button type="submit" class="bg-red-600 border border-transparent rounded-md shadow-sm py-2 px-4 text-sm font-medium text-white hover:bg-red-700 focus:outline-none">
                Ya, Hapus Mitra
            </button>
        </form>

    </div>
</div>
{% endblock %}
