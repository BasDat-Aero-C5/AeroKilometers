{% load static %}

<nav class="fixed top-0 left-0 w-full">
    <div class="mx-auto px-4 sm:px-6 lg:px-20">
        <div class="flex items-center justify-between h-24">
            
            <div class="flex-shrink-0">
                <a href=""> <img src="{% static 'img/logo.png' %}" alt="Logo" class="h-8 w-auto">
                </a>
            </div>
            
            <div class="hidden md:flex items-center space-x-6 lg:space-x-14">
                <a href="{% url 'main:home' %}" class="text-neutral-50 hover:text-gray-300 transition-colors text-sm font-medium">
                    Home
                </a>
                <a href="#" class="text-neutral-50 hover:text-gray-300 transition-colors text-sm font-medium">
                    About
                </a>
                <a href="#" class="text-neutral-50 hover:text-gray-300 transition-colors text-sm font-medium">
                    Contact
                </a>
            </div>
            <div class="hidden md:flex items-center space-x-4 lg:space-x-6">
                {% if user.is_authenticated %} 
                    <div class="flex items-center space-x-4">
                        <div class="font-medium text-neutral-50">{{ name|default:user.username }}</div>
                        <a href="{% url 'main:logout' %}" class="px-3 py-1.5 text-red-400 hover:text-red-500 border border-red-400 rounded-lg text-sm font-medium transition-colors">
                            Logout
                        </a>
                    </div>
                {% else %}
                    <a href="{% url 'main:login' %}" class="text-neutral-50 hover:bg-zinc-800 border border-gray-600 px-6 py-3 rounded-xl font-medium transition-colors text-sm">
                        Login
                    </a>
                    <a href="{% url 'main:register' %}" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-medium transition-colors flex items-center text-sm">
                        <img src= "{% static "img/signup.svg" %}" alt="Signup Icon" class="inline h-4 w-4 mr-2">
                        Sign Up
                    </a>
                {% endif %}
            </div>
            
        
            <div class="md:hidden flex items-center">
                <button class="mobile-menu-button p-2 text-neutral-50 hover:text-gray-300 transition-colors">
                    <span class="sr-only">Open menu</span>
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>
</nav>
