{% load static %}

<nav class="fixed top-0 left-0 w-full z-50 bg-navy-300/95 backdrop-blur-xl border-b border-navy-200/30 shadow-xl">
  <div class="mx-auto px-4 sm:px-6 lg:px-20">
    <div class="flex items-center justify-between h-24">
      <div class="flex items-center gap-3">
        <a href="{% url 'main:home' %}" class="flex items-center gap-3">
          <img src="{% static 'img/logo.png' %}" alt="AeroMiles Logo" class="h-10 w-auto">
          <div>
            <p class="text-white font-bold text-lg tracking-tight">AeroMiles</p>
            <p class="text-navy-50 text-xs uppercase tracking-[0.24em]">Travel Loyalty</p>
          </div>
        </a>
      </div>

      <!-- Desktop Auth Buttons -->
      <div class="hidden md:flex items-center gap-3">
        <a href="{% url 'main:login' %}" class="px-5 py-2 text-navy-50 border border-navy-100 rounded-full hover:bg-navy-400 transition-colors font-medium">Login</a>
        <a href="{% url 'main:register' %}" class="inline-flex items-center justify-center px-5 py-2 bg-gold-300 text-navy-800 rounded-full hover:bg-gold-400 transition-colors font-medium">Register</a>
      </div>

      <!-- Mobile Menu Button -->
      <div class="md:hidden flex items-center">
        <button type="button" class="mobile-menu-button inline-flex items-center justify-center p-2 rounded-full text-navy-50 border border-navy-100 hover:bg-navy-400 transition-colors">
          <span class="sr-only">Open menu</span>
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile Menu -->
    <div class="mobile-menu hidden md:hidden pb-6">
      <div class="mt-4 px-2 space-y-3">
        <a href="{% url 'main:login' %}" class="block rounded-full px-4 py-3 text-center text-navy-50 border border-navy-100 hover:bg-navy-400 transition-colors font-medium">Login</a>
        <a href="{% url 'main:register' %}" class="block rounded-full px-4 py-3 text-center bg-gold-300 text-navy-800 hover:bg-gold-400 transition-colors font-medium">Register</a>
      </div>
    </div>
  </div>
</nav>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const button = document.querySelector('.mobile-menu-button');
    const menu = document.querySelector('.mobile-menu');
    if (!button || !menu) return;
    button.addEventListener('click', () => {
      menu.classList.toggle('hidden');
    });
  });
</script>
