{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  {% block meta %}
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AeroMiles Travel Platform">
  {% endblock meta %}

  <title>{% block title %}AeroMiles{% endblock %}</title>

  <link rel="icon" href="{% static 'img/logo.png' %}" type="image/png">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            navy: {
              50:  '#b2cde0',
              100: '#6497b2',
              200: '#015b97',
              300: '#04396d',
              400: '#25354c',
            },
            gold: {
              50:  '#f8e48b',
              100: '#f2d56d',
              200: '#eec55b',
              300: '#f3cb51',
              400: '#bf9c4a',
              500: '#8a7037',
            },
          },
          fontFamily: {
            heading: ['"Playfair Display"', 'serif'],
            body: ['Poppins', 'sans-serif'],
          },
        }
      }
    }
  </script>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="{% static 'css/styles.css' %}" />

  {% block extra_head %}{% endblock %}
</head>

<body class="bg-navy-400 text-white font-body min-h-screen flex flex-col">

  {% include 'navbar.html' %}

  <main class="flex-1 w-full max-w-7xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>

  {% block extra_scripts %}{% endblock %}

</body>
</html>
