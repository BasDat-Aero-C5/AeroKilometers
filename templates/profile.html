{% extends "base.html" %}
{% block content %}

<div class="max-w-3xl mx-auto">

  <!-- TITLE -->
  <h2 class="text-2xl font-semibold">Pengaturan Profil</h2>

  <!-- PROFILE CARD -->
  <div class="bg-white/95 backdrop-blur-md text-navy-800 rounded-2xl p-6 shadow-lg border border-navy-100 mt-6">

    <h3 class="font-semibold mb-4">Data Profil</h3>

    <!-- EMAIL -->
    <div class="mb-4">
      <label class="text-sm font-medium">Email</label>
      <input type="text" value="{{ user.email }}" disabled
        class="w-full mt-1 px-3 py-2 border rounded-lg bg-gray-100 text-blue-500">
    </div>

    <!-- MEMBER -->
    {% if role == "member" %}
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="text-sm">Nomor Member</label>
        <input value="{{ user.member_id }}" disabled
          class="w-full mt-1 px-3 py-2 border rounded-lg bg-gray-100">
      </div>

      <div>
        <label class="text-sm">Tanggal Bergabung</label>
        <input value="{{ user.joined }}" disabled
          class="w-full mt-1 px-3 py-2 border rounded-lg bg-gray-100">
      </div>
    </div>
    {% endif %}

    <!-- STAFF -->
    {% if role == "staff" %}
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="text-sm">ID Staff</label>
        <input value="{{ user.staff_id }}" disabled
          class="w-full mt-1 px-3 py-2 border rounded-lg bg-gray-100">
      </div>

      <div>
        <label class="text-sm">Kode Maskapai</label>
        <input value="{{ user.airline }}"
          class="w-full mt-1 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-navy-300 outline-none">
      </div>
    </div>
    {% endif %}

    <!-- SALUTATION -->
    <div class="mt-4">
      <label class="text-sm">Salutation</label>
      <select class="w-full mt-1 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-navy-300 outline-none">
        <option {% if user.salutation == "Mr." %}selected{% endif %}>Mr.</option>
        <option>Mrs.</option>
      </select>
    </div>

    <!-- NAME -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
      <input placeholder="Nama Depan" value="{{ user.first }}"
        class="px-3 py-2 border rounded-lg focus:ring-2 focus:ring-navy-300 outline-none">

      <input placeholder="Nama Tengah" value="{{ user.middle }}"
        class="px-3 py-2 border rounded-lg focus:ring-2 focus:ring-navy-300 outline-none">

      <input placeholder="Nama Belakang" value="{{ user.last }}"
        class="px-3 py-2 border rounded-lg focus:ring-2 focus:ring-navy-300 outline-none">
    </div>

    <!-- NATIONALITY -->
    <div class="mt-4">
      <label class="text-sm">Kewarganegaraan</label>
      <select class="w-full mt-1 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-navy-300 outline-none">
        <option selected>{{ user.nationality }}</option>
      </select>
    </div>

    <!-- PHONE -->
    <div class="grid grid-cols-2 gap-4 mt-4">
      <input value="{{ user.country_code }}"
        class="px-3 py-2 border rounded-lg focus:ring-2 focus:ring-navy-300 outline-none">

      <input value="{{ user.phone }}"
        class="px-3 py-2 border rounded-lg focus:ring-2 focus:ring-navy-300 outline-none">
    </div>

    <!-- BIRTHDATE -->
    <div class="mt-4">
      <label class="text-sm">Tanggal Lahir</label>
      <input type="date" value="{{ user.birthdate }}"
        class="w-full mt-1 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-navy-300 outline-none">
    </div>

    <!-- SAVE BUTTON -->
    <button class="mt-6 bg-navy-400 hover:bg-navy-500 text-white px-5 py-2 rounded-lg transition">
      Simpan Perubahan
    </button>

  </div>

  <!-- PASSWORD CARD -->
  <div class="bg-white/95 backdrop-blur-md text-navy-800 rounded-2xl p-6 shadow-lg border border-navy-100 mt-6">

    <h3 class="font-semibold mb-3">Ubah Password</h3>

    <button onclick="openModal()"
      class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded-lg text-sm transition">
      Ubah Password
    </button>

  </div>

</div>

<!-- MODAL -->
<div id="modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">

  <div class="bg-white text-navy-800 p-6 rounded-2xl w-[400px] shadow-xl">

    <div class="flex justify-between items-center mb-3">
      <h3 class="font-semibold">Ubah Password</h3>
      <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">✕</button>
    </div>

    <input type="password" placeholder="Password Lama"
      class="w-full mb-2 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-navy-300 outline-none">

    <input type="password" placeholder="Password Baru"
      class="w-full mb-2 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-navy-300 outline-none">

    <input type="password" placeholder="Konfirmasi Password Baru"
      class="w-full mb-4 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-navy-300 outline-none">

    <div class="flex justify-end gap-2">
      <button onclick="closeModal()"
        class="px-4 py-2 bg-gray-200 rounded-lg hover:bg-gray-300">
        Batal
      </button>

      <button class="px-4 py-2 bg-navy-400 text-white rounded-lg hover:bg-navy-500">
        Simpan
      </button>
    </div>

  </div>

</div>

<script>
function openModal() {
  document.getElementById("modal").classList.remove("hidden");
}

function closeModal() {
  document.getElementById("modal").classList.add("hidden");
}
</script>

{% endblock %}
