{% extends 'base.html' %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 py-8">
    <div class="bg-white p-8 rounded-lg shadow border border-gray-200">
        <h2 class="text-2xl font-bold text-gray-800 mb-2">Daftarkan Mitra Baru</h2>
        <p class="text-sm text-gray-500 mb-6">ID Penyedia akan di-generate secara otomatis oleh sistem saat data mitra disimpan.</p>
        
        <form action="#" method="POST">
            {% csrf_token %}
            
            <div class="grid grid-cols-1 gap-6">
                <!-- Nama Mitra -->
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nama Mitra</label>
                    <input type="text" placeholder="Masukkan nama perusahaan/organisasi mitra..." class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-emerald-500 focus:border-emerald-500 sm:text-sm">
                </div>

                <!-- Email Mitra -->
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email Mitra</label>
                    <input type="email" placeholder="Contoh: partnership@mitra.com" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-emerald-500 focus:border-emerald-500 sm:text-sm">
                </div>

                <!-- Tanggal Kerja Sama -->
                <div>
                    <label class="block text-sm font-medium text-gray-700">Tanggal Kerja Sama</label>
                    <input type="date" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-emerald-500 focus:border-emerald-500 sm:text-sm">
                </div>
            </div>

            <div class="mt-8 flex justify-end space-x-3">
                <a href="{% url 'red:daftar_mitra' %}" class="bg-white py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none">Batal</a>
                <button type="submit" class="bg-emerald-600 border border-transparent rounded-md shadow-sm py-2 px-4 text-sm font-medium text-white hover:bg-emerald-700 focus:outline-none">Daftarkan Mitra</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
