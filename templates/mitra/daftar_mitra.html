{% extends 'base.html' %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-gold-300">Manajemen Mitra</h1>
        <a href="{% url 'red:tambah_mitra' %}" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-md font-medium transition shadow">
            + Daftarkan Mitra
        </a>
    </div>

    <!-- Table Section -->
    <div class="bg-white rounded-lg shadow overflow-hidden border border-gray-200">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email Mitra</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID Penyedia</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nama Mitra</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Tanggal Kerja Sama</th>
                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Aksi</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                
                <!-- Data Dummy 1 -->
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">contact@traveloka.com</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">102</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">Traveloka</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">15/03/2025</td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <a href="{% url 'red:edit_mitra' %}" class="text-indigo-600 hover:text-indigo-900 mr-3">Edit</a>
                        <a href="{% url 'red:hapus_mitra' %}" class="text-red-600 hover:text-red-900">Hapus</a>
                    </td>
                </tr>

                <!-- Data Dummy 2 -->
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">partnership@tiket.com</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">103</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">Tiket.com</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">10/06/2025</td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <a href="{% url 'red:edit_mitra' %}" class="text-indigo-600 hover:text-indigo-900 mr-3">Edit</a>
                        <a href="{% url 'red:hapus_mitra' %}" class="text-red-600 hover:text-red-900">Hapus</a>
                    </td>
                </tr>
                
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
