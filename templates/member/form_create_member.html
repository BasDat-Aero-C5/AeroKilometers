{% extends 'base.html' %}
{% load static %}

{% block title %}Tambah Identitas | AeroMiles{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto py-10">
  <div class="mb-8">
    <a href="{% url 'yellow:page' %}" class="inline-flex items-center gap-2 text-sm text-navy-50 hover:text-gold-300 transition-colors">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 19l-7-7 7-7"/>
      </svg>
      Kembali ke Identitas Saya
    </a>
    <h1 class="mt-4 font-heading text-3xl font-bold text-gold-300">Tambah Identitas Baru</h1>
    <p class="mt-2 text-sm text-navy-50/80">Isi data dokumen identitas yang ingin disimpan.</p>
  </div>

  <div class="bg-navy-300/30 border border-navy-300/50 shadow-lg rounded-3xl p-8">
    <form method="post" class="space-y-6">
      {% csrf_token %}

      <div>
        <label class="block text-sm font-medium text-navy-50 mb-2">Nomor Dokumen</label>
        <input type="text" name="nomor_dokumen" required placeholder="contoh: PAS123456"
          class="w-full rounded-2xl border border-navy-200/40 bg-navy-400/70 px-4 py-3 text-white text-sm placeholder-navy-100/60 focus:outline-none focus:border-gold-300 focus:ring-2 focus:ring-gold-300/20 transition-colors" />
      </div>

      <div class="grid gap-5 md:grid-cols-2">
        <div>
          <label class="block text-sm font-medium text-navy-50 mb-2">Jenis Dokumen</label>
          <select name="jenis_dokumen" required
            class="w-full rounded-2xl border border-navy-200/40 bg-navy-400/70 px-4 py-3 text-white text-sm focus:outline-none focus:border-gold-300 focus:ring-2 focus:ring-gold-300/20 transition-colors">
            <option value="">Pilih jenis</option>
            <option value="Paspor">Paspor</option>
            <option value="KTP">KTP</option>
            <option value="SIM">SIM</option>
            <option value="KITAS">KITAS</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-navy-50 mb-2">Negara Penerbit</label>
          <select name="negara" required
            class="w-full rounded-2xl border border-navy-200/40 bg-navy-400/70 px-4 py-3 text-white text-sm focus:outline-none focus:border-gold-300 focus:ring-2 focus:ring-gold-300/20 transition-colors">
            <option value="">Pilih negara</option>
            <option value="Indonesia">Indonesia</option>
            <option value="Malaysia">Malaysia</option>
            <option value="Singapura">Singapura</option>
            <option value="Thailand">Thailand</option>
          </select>
        </div>
      </div>

      <div class="grid gap-5 md:grid-cols-2">
        <div>
          <label class="block text-sm font-medium text-navy-50 mb-2">Tanggal Terbit</label>
          <input type="date" name="tanggal_terbit" required
            class="w-full rounded-2xl border border-navy-200/40 bg-navy-400/70 px-4 py-3 text-white text-sm focus:outline-none focus:border-gold-300 focus:ring-2 focus:ring-gold-300/20 transition-colors" />
        </div>

        <div>
          <label class="block text-sm font-medium text-navy-50 mb-2">Tanggal Habis</label>
          <input type="date" name="tanggal_habis" required
            class="w-full rounded-2xl border border-navy-200/40 bg-navy-400/70 px-4 py-3 text-white text-sm focus:outline-none focus:border-gold-300 focus:ring-2 focus:ring-gold-300/20 transition-colors" />
        </div>
      </div>

      <div class="flex flex-col gap-3 sm:flex-row sm:justify-end">
        <a href="{% url 'yellow:page' %}"
          class="inline-flex items-center justify-center rounded-2xl border border-navy-200/40 bg-navy-400/70 px-5 py-3 text-sm font-medium text-white hover:bg-navy-400 transition-colors">
          Batal
        </a>
        <button type="submit"
          class="inline-flex items-center justify-center rounded-2xl bg-gold-300 px-5 py-3 text-sm font-semibold text-navy-800 hover:bg-gold-200 transition-colors">
          Simpan Identitas
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
